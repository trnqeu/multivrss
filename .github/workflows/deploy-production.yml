name: Deploy to Production

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/trnqeu/multivrss

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & Push Image
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: GIT_COMMIT=${{ github.sha }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: GIT_COMMIT=${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ghcr.io/trnqeu/multivrss
          SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE,SHA,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -euo pipefail

            # Save current SHA for rollback
            PREV_SHA=$(cat ~/.multivrss_prod_sha 2>/dev/null || echo "")
            echo "$SHA" > ~/.multivrss_prod_sha

            # Login to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull new images
            docker pull "$IMAGE:$SHA-migrator"
            docker pull "$IMAGE:$SHA"

            # Run migrations (one-shot container, isolated)
            docker run --rm \
              --network multivrss_internal \
              --env-file ~/multivrss/.env.production \
              "$IMAGE:$SHA-migrator" \
              npx prisma migrate deploy

            # Deploy new stack
            cd ~/multivrss
            IMAGE_TAG="$SHA" \
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans

            # Health check — 12 attempts × 5s = 60s timeout
            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              STATUS=$(curl -sf https://multivrss.com/api/health \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
              if [ "$STATUS" = "ok" ]; then
                echo "Health check passed (attempt $i)"
                exit 0
              fi
              echo "Attempt $i/12 failed, retrying in 5s..."
              sleep 5
            done

            # Rollback
            echo "Health check failed — rolling back to $PREV_SHA"
            if [ -n "$PREV_SHA" ]; then
              docker pull "$IMAGE:$PREV_SHA"
              IMAGE_TAG="$PREV_SHA" \
              docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            fi
            exit 1
