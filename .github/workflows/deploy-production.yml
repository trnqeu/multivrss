name: Deploy to Production

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/trnqeu/multivrss

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & Push Image
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: write
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ghcr.io/trnqeu/multivrss
          SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE,SHA,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -euo pipefail

            # Sync compose file from git to prevent drift
            cd ~/multivrss
            git fetch origin main --depth=1
            git checkout origin/main -- docker-compose.prod.yml

            # Save current SHA for rollback
            PREV_SHA=$(cat ~/.multivrss_prod_sha 2>/dev/null || echo "")
            echo "$SHA" > ~/.multivrss_prod_sha

            # Login to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Pull new images (retry: GHCR can briefly return "denied" for a
            # manifest the build job just pushed, before it's fully propagated)
            pull_with_retry() {
              for i in $(seq 1 6); do
                docker pull "$1" && return 0
                echo "Pull of $1 failed (attempt $i/6), retrying in 10s..."
                sleep 10
              done
              return 1
            }
            pull_with_retry "$IMAGE:$SHA-migrator"
            pull_with_retry "$IMAGE:$SHA"

            # Remove any manually-created network to avoid label mismatch
            docker network rm multivrss-prod_internal 2>/dev/null || true

            # Start backing services first so the migrator can reach the DB
            IMAGE_TAG="$SHA" \
            docker compose -f docker-compose.prod.yml --project-name multivrss-prod --env-file .env.production up -d db redis

            # Wait for Postgres to accept connections (12 × 5s = 60s)
            echo "Waiting for Postgres..."
            for i in $(seq 1 12); do
              if docker compose -f docker-compose.prod.yml --project-name multivrss-prod --env-file .env.production exec -T db pg_isready -q 2>/dev/null; then
                echo "Postgres ready (attempt $i)"
                break
              fi
              [ "$i" = "12" ] && echo "Postgres did not become ready in time" && exit 1
              echo "Attempt $i/12, retrying in 5s..."
              sleep 5
            done

            # Run migrations (one-shot container, isolated)
            docker run --rm \
              --network multivrss-prod_internal \
              --env-file ~/multivrss/.env.production \
              "$IMAGE:$SHA-migrator" \
              npx prisma migrate deploy

            # Deploy full stack
            cd ~/multivrss
            IMAGE_TAG="$SHA" \
            docker compose -f docker-compose.prod.yml --project-name multivrss-prod --env-file .env.production pull app worker
            IMAGE_TAG="$SHA" \
            docker compose -f docker-compose.prod.yml --project-name multivrss-prod --env-file .env.production up -d --remove-orphans --force-recreate

            # Health check — 12 attempts × 5s = 60s timeout (production on port 3001)
            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              STATUS=$(curl -s http://localhost:3001/api/health \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
              if [ "$STATUS" = "ok" ]; then
                echo "Health check passed (attempt $i)"
                # Reclaim disk: drop unused local images older than 3 days
                # (keeps the current release plus recent rollback targets)
                docker image prune -af --filter "until=72h" || true
                exit 0
              fi
              echo "Attempt $i/12 failed, retrying in 5s..."
              sleep 5
            done

            # Rollback
            echo "Health check failed — rolling back to $PREV_SHA"
            if [ -n "$PREV_SHA" ]; then
              docker pull "$IMAGE:$PREV_SHA"
              IMAGE_TAG="$PREV_SHA" \
              docker compose -f docker-compose.prod.yml --project-name multivrss-prod --env-file .env.production up -d --force-recreate
            fi
            exit 1

      - name: Cleanup old GHCR images
        uses: actions/delete-package-versions@v5
        with:
          package-name: multivrss
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: "^(staging|production|latest)$"
        continue-on-error: true
