name: Deploy to Staging

on:
  push:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/multivrss
            git pull origin dev
            docker build --target builder --build-arg GIT_COMMIT=$(git rev-parse HEAD) -t multivrss-builder .
            docker build --build-arg GIT_COMMIT=$(git rev-parse HEAD) -t multivrss-app .
            docker network create multivrss_internal 2>/dev/null || true
            docker run --rm --network multivrss_internal --env-file .env.staging multivrss-builder npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env.staging up -d

