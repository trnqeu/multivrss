name: Release Please

# Watches main (production) only: CHANGELOG.md entries should reflect what's
# actually shipped, not what's sitting on dev/staging.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
