version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (native Go compiler) is not yet supported by
      # typescript-eslint (peer range >=4.8.4 <6.1.0). Re-enable once it is.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 is outside the peer ranges of the plugins bundled by
      # eslint-config-next (import, jsx-a11y, react). Re-enable once it is.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @sentry/nextjs 11 removes withSentryConfig used in next.config.ts:
      # needs a manual migration, not a drop-in bump.
      - dependency-name: "@sentry/nextjs"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
