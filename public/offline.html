<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — MultivRSS</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  main {
    max-width: 360px;
  }
  h1 {
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 20px;
    margin-bottom: 12px;
  }
  p {
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    line-height: 1.5;
  }
  .accent { color: #E2725B; }
</style>
</head>
<body>
<main>
  <h1><span class="accent">MULTIVRSS</span> // OFFLINE</h1>
  <p>You're not connected to the internet. Reconnect and try again.</p>
</main>
</body>
</html>
