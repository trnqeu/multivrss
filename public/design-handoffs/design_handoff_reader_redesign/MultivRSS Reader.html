<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultivRSS — Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --fg:#14110d; --tc:#E2725B;
  --f70:rgba(20,17,13,.70);--f55:rgba(20,17,13,.55);--f45:rgba(20,17,13,.45);
  --f35:rgba(20,17,13,.35);--f25:rgba(20,17,13,.25);--f14:rgba(20,17,13,.14);--f08:rgba(20,17,13,.07);
  --tc-soft:rgba(226,114,91,.10);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --serif:"Newsreader",Georgia,serif;
}
/* ===== DARK MODE ===== */
body[data-theme="dark"]{
  --bg:#0e0d0b; --fg:#f4f1ea; --tc:#E2725B;
  --f70:rgba(244,241,234,.72);--f55:rgba(244,241,234,.55);--f45:rgba(244,241,234,.42);
  --f35:rgba(244,241,234,.32);--f25:rgba(244,241,234,.20);--f14:rgba(244,241,234,.14);--f08:rgba(244,241,234,.07);
  --tc-soft:rgba(226,114,91,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{cursor:pointer}
.lbl{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.muted{color:var(--f35)}
.dek{font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--f55);font-weight:400}
.dek.small{font-size:13.5px;line-height:1.5}

/* action cluster — hidden until row hover */
.acts{display:inline-flex;gap:9px;align-items:center;margin-left:8px;opacity:0;transition:opacity .13s}
.a{font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.12em;color:var(--f45);display:inline-flex;align-items:center;transition:color .12s}
.a:hover{color:var(--tc)}
.a--bk.is-on{color:var(--tc);opacity:1}
.a--rd.is-on{color:var(--tc)}
.a--rd{font-size:10px}

/* ============ APP SHELL ============ */
.app{display:flex;height:100%;overflow:hidden}
.mainc{flex:1;display:flex;flex-direction:column;min-width:0}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--f25) transparent}
.scroll::-webkit-scrollbar{width:10px}
.scroll::-webkit-scrollbar-thumb{background:var(--f14)}

/* ============ SIDEBAR ============ */
.sb{width:212px;flex-shrink:0;border-right:2px solid var(--fg);display:flex;flex-direction:column;background:var(--bg)}
.sb__brand{display:flex;align-items:center;gap:11px;padding:18px 18px;border-bottom:2px solid var(--fg)}
.sb__logo{width:28px;height:28px;object-fit:contain}
.sb__name{font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--tc)}
.sb__nav{flex:1;padding:18px 14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:none}
.sb__nav::-webkit-scrollbar{display:none}
.sb__gap{margin-top:10px}
.nvi{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);padding:3px 4px;text-align:left;width:100%}
.nvi:hover{color:var(--tc)}
.nvi.on{color:var(--tc)}
.nvi__c{margin-left:auto;font-size:9px;color:var(--f35)}
.sbc{display:flex;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid var(--f08);width:100%;text-align:left}
.sbc__n{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--f55)}
.sbc__c{font-size:9px;color:var(--f25)}
.sbc__go{margin-left:auto;font-size:11px;color:var(--f25);opacity:0;transition:.12s}
.sbc:hover{background:var(--tc-soft)}
.sbc:hover .sbc__n{color:var(--fg)}
.sbc:hover .sbc__go{opacity:1;color:var(--tc)}
.sbc.on .sbc__n{color:var(--tc)}
.sbc.on{background:var(--tc-soft)}
.sbc.on .sbc__go{opacity:1;color:var(--tc)}
.sb__foot{padding:13px 18px;border-top:2px solid var(--fg);line-height:1.7}

/* ============ TOP BAR ============ */
.top{display:flex;align-items:center;gap:12px;height:54px;flex-shrink:0;border-bottom:2px solid var(--fg);padding:0 18px}
.tabs{display:flex;border:1.5px solid var(--fg)}
.tab{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.12em;padding:7px 12px;color:var(--f35);border-right:1.5px solid var(--fg)}
.tab:last-child{border-right:0}
.tab.on{background:var(--fg);color:var(--bg)}
.tab:not(.on):hover{color:var(--fg)}
.search{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:1px solid var(--f25);min-width:220px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--f35)}
.search__q{color:var(--tc);font-weight:800}
.spring{flex:1}
.tbtn{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--f55);padding:7px 10px}
.tbtn:hover{color:var(--fg)}
.tbtn--solid{background:var(--fg);color:var(--bg)}
.tbtn--solid:hover{background:var(--tc);color:var(--bg)}
.tico{color:var(--f45);font-size:14px}
.tico:hover{color:var(--fg);cursor:pointer}

/* ============ TELEMETRY ============ */
.tele{position:relative;z-index:20;padding:9px 18px;border-bottom:2px solid var(--fg);font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--f45);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:visible}
.tele b{color:var(--fg);font-weight:800}
.tele i{color:var(--f25);font-style:normal;margin:0 4px}

/* dropdown (FILTER + CATEGORY share this UX) */
.dd{position:relative;display:inline-flex;align-items:center;gap:6px}
.dd__lbl{color:var(--f45)}
.dd__btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--tc);padding:3px 7px;border:1px solid var(--f14)}
.dd__btn:hover{border-color:var(--tc)}
.dd__btn b{color:var(--tc);font-weight:800}
.dd__car{color:var(--f35);font-size:8px}
.dd__menu{position:absolute;top:calc(100% + 7px);left:0;z-index:80;min-width:158px;background:var(--bg);border:2px solid var(--fg);box-shadow:0 14px 34px rgba(0,0,0,.20);padding:4px}
.dd__opt{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--f55);padding:8px 11px}
.dd__opt:hover{background:var(--tc-soft);color:var(--fg)}
.dd__opt.on{color:var(--tc)}

/* ============ RIVER — LEDGER ============ */
.river{padding:6px 20px 90px}
.lgday{display:flex;align-items:center;gap:12px;margin:16px 0 8px}
.lgday span{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.28em;color:var(--tc);white-space:nowrap}
.lgday i{flex:1;height:1px;background:rgba(226,114,91,.3)}
.lg{display:grid;grid-template-columns:16px 150px 42px 1fr auto auto;align-items:baseline;gap:0 12px;padding:6px 6px;margin:0 -6px;border-top:1px solid var(--f08)}
.lg:hover{background:var(--tc-soft)}
.lg:hover .acts{opacity:1}
.lg__dot{color:var(--tc);font-size:11px;line-height:1;align-self:center;padding:0}
.lg.is-read{opacity:.42}
.lg.is-read .lg__dot{color:var(--f35)}
.lg__src{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg__date{font-family:var(--mono);font-size:9.5px;color:var(--f35);white-space:nowrap}
.lg__main{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lg__title{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:-.005em;color:var(--fg)}
.lg:hover .lg__title{color:var(--tc)}
.lg__prev{font-family:var(--serif);font-size:14px;color:var(--f45);font-weight:400}
.lg__c{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--f35);padding-left:4px}
.lg-empty{padding:40px 6px;font-family:var(--serif);font-size:16px;color:var(--f35)}

/* ============ FRONT PAGE ============ */
.fp{padding:22px 26px 90px}
.mast__t{font-family:var(--serif);font-weight:600;font-size:42px;letter-spacing:-.02em;line-height:1;text-transform:uppercase}
.mast__rule{height:3px;background:var(--fg);margin:12px 0 8px}
.mast__meta{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--f45);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mast__meta b{color:var(--fg);font-weight:800}
.mast__meta i{color:var(--f25);font-style:normal;margin:0 3px}

/* FOR YOU ribbon */
.ribbon{display:flex;align-items:stretch;gap:16px;padding:14px 16px;border:2px solid var(--fg);margin:6px 0 26px}
.rib__lbl{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.2em;color:var(--tc);white-space:nowrap;align-self:center}
.rib{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.rib__cat{font-family:var(--mono);font-size:7.5px;font-weight:800;letter-spacing:.14em;color:var(--f35)}
.rib__t{font-family:var(--serif);font-weight:600;font-size:14.5px;line-height:1.16;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rib:hover .rib__t{color:var(--tc)}
.rib__why{font-family:var(--mono);font-size:7.5px;font-weight:800;letter-spacing:.1em;color:var(--f35);margin-top:2px}
.rib__sep{width:1px;background:var(--f14);align-self:stretch}

/* section grid — the "section fronts" */
.secgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--f14);border:1px solid var(--f14)}
.sec{background:var(--bg);padding:20px 20px 0;display:flex;flex-direction:column}
.sec__h{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:2px solid var(--fg);margin-bottom:14px}
.sec__n{font-family:var(--mono);font-size:12.5px;font-weight:800;letter-spacing:.18em}
.sec__c{font-family:var(--mono);font-size:10px;color:var(--f35)}
.sec__lead{margin-bottom:14px}
.sec__lt{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.12;letter-spacing:-.01em;color:var(--fg);display:block;margin-bottom:8px}
.sec__lt:hover{color:var(--tc)}
.sec__list{list-style:none;border-top:1px solid var(--f14)}
.sec__row{padding:10px 0;border-bottom:1px solid var(--f08)}
.sec__rt{font-family:var(--serif);font-weight:500;font-size:14.5px;line-height:1.24;color:var(--fg);display:block}
.sec__row.is-read{opacity:.4}
.sec__row:hover .sec__rt{color:var(--tc)}
.metaline,.sec__rm{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:8.5px;font-weight:600;letter-spacing:.08em;color:var(--f35);flex-wrap:wrap}
.metaline{margin-top:8px}
.sec__rm{margin-top:6px}
.metaline i,.sec__rm i{color:var(--f25);font-style:normal}
.ml__src{color:var(--tc);font-weight:800;letter-spacing:.1em}
.sec__lead:hover .acts,.sec__row:hover .acts{opacity:1}

/* VIEW ALL — the prominent per-section button */
.sec__all{margin:14px -20px 0;padding:13px 20px;background:var(--fg);color:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;transition:.14s}
.sec__all:hover{background:var(--tc);color:#fff}
.sec__all-arr{font-size:14px;transition:transform .14s}
.sec__all:hover .sec__all-arr{transform:translateX(4px)}

@media (max-width:1240px){ .secgrid{grid-template-columns:repeat(2,1fr)} .ribbon{flex-wrap:wrap} }
@media (max-width:900px){ .sb{display:none} .secgrid{grid-template-columns:1fr} .lg{grid-template-columns:16px 1fr auto} .lg__src,.lg__date,.lg__c{display:none} }
</style>
</head>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</body>
</html>
