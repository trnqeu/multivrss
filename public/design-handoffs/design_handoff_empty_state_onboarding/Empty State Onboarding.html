<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MultivRSS — Empty State / Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000; --fg:#fff; --tc:#E2725B;
    --fg70:rgba(255,255,255,.7); --fg55:rgba(255,255,255,.55); --fg50:rgba(255,255,255,.5); --fg40:rgba(255,255,255,.4);
    --fg30:rgba(255,255,255,.3); --fg20:rgba(255,255,255,.2); --fg15:rgba(255,255,255,.15);
    --fg08:rgba(255,255,255,.08); --fg04:rgba(255,255,255,.04);
    --tc12:rgba(226,114,91,.12); --tc40:rgba(226,114,91,.4); --tc20:rgba(226,114,91,.2);
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --serif:"Newsreader",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-font-smoothing:antialiased}
  #root{height:100%}
  .lbl{font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
  .muted{color:var(--fg40)}
  .tc{color:var(--tc)}

  .app{display:flex;height:100%;overflow:hidden}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--fg20) transparent}
  .scroll::-webkit-scrollbar{width:10px}
  .scroll::-webkit-scrollbar-thumb{background:var(--fg15)}

  /* ───────── sidebar ───────── */
  .sb{width:256px;flex-shrink:0;border-right:2px solid var(--fg);display:flex;flex-direction:column;background:var(--bg)}
  .sb__brand{display:flex;align-items:center;gap:13px;padding:22px;border-bottom:2px solid var(--fg)}
  .sb__logo{width:34px;height:34px;object-fit:contain}
  .sb__name{font-size:16px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--tc)}
  .sb__sync{display:flex;align-items:center;gap:7px;padding:11px 22px;border-bottom:1px solid var(--fg15);font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--fg40)}
  .sb__dot{width:6px;height:6px;background:var(--fg30);border-radius:50%;display:inline-block}
  .sb__dot.live{background:var(--tc);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .sb__nav{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:15px;scrollbar-width:none}
  .sb__nav::-webkit-scrollbar{display:none}
  .navitem{display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--fg);padding-left:8px;border-left:2px solid transparent;cursor:pointer;transition:.12s}
  .navitem:hover{color:var(--bg);background:var(--fg);border-left-color:var(--fg)}
  .navitem.active{border-left-color:var(--tc);color:var(--tc)}
  .navitem__i{display:flex;width:13px}
  .navitem__l{flex:1}
  .navitem__c{font-size:9px;font-weight:800;color:var(--fg40);letter-spacing:.1em}
  .sb__catlbl{margin-top:14px}
  .sbcat{display:flex;flex-direction:column;gap:7px}
  .sbcat__head{display:flex;justify-content:space-between;align-items:center}
  .sbcat__n{color:var(--fg40)}
  .sbcat__src{display:flex;flex-direction:column;gap:4px;padding-left:2px}
  .sbcat__s{font-size:9.5px;font-weight:600;letter-spacing:.1em;color:var(--fg30);text-transform:uppercase}
  .sb__empty{display:flex;flex-direction:column;gap:9px;padding-left:2px}
  .sb__emptyrow{height:9px;background:var(--fg08);width:80%}
  .sb__emptyrow:nth-child(2){width:62%}
  .sb__emptyrow:nth-child(3){width:71%}
  .sb__emptynote{font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--fg30);line-height:1.7;margin-top:4px}
  .sb__foot{padding:20px 22px;border-top:2px solid var(--fg);font-size:8.5px;line-height:1.7;color:var(--fg40)}

  /* ───────── top bar ───────── */
  .top{display:flex;align-items:center;gap:18px;height:56px;flex-shrink:0;border-bottom:2px solid var(--fg);padding:0 26px;background:var(--bg)}
  .flex1{flex:1}
  .search{display:flex;align-items:center;gap:9px;min-width:260px;height:32px;padding:0 12px;border:1px solid var(--fg20)}
  .search__q{color:var(--tc);font-size:10px;font-weight:800}
  .search__ph{color:var(--fg30);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .ingest{display:flex;align-items:stretch;border:1px solid var(--fg30);height:30px}
  .ingest__plus{display:flex;align-items:center;justify-content:center;width:30px;color:var(--tc);background:rgba(226,114,91,.1);border-right:1px solid var(--fg20);font-size:14px}
  .ingest__b{background:none;border:0;border-right:1px solid var(--fg20);color:var(--fg);font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.13em;padding:0 12px;cursor:pointer}
  .ingest__b:last-child{border-right:0}
  .ingest__b:hover{background:var(--fg);color:var(--bg)}
  .top__sync{background:none;border:0;color:var(--tc);font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.13em;cursor:pointer}
  .top__ico{color:var(--fg50);font-size:14px;cursor:pointer}

  /* ═════════ EMPTY STATE ═════════ */
  .es{max-width:760px;margin:0 auto;padding:60px 32px 100px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .es__mark{width:120px;height:auto;object-fit:contain;opacity:.95}
  .es__word{font-size:26px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--tc);margin-top:18px}
  .es__signal{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:10px;font-weight:800;letter-spacing:.26em;color:var(--tc);border:1px solid var(--tc40);padding:5px 12px}
  .es__signal .d{width:6px;height:6px;background:var(--tc);border-radius:50%}
  .es__title{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.08;letter-spacing:-.02em;margin-top:20px}
  .es__sub{font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--fg55);line-height:1.6;margin-top:14px;max-width:42ch}
  .es__sub b{color:var(--fg);font-weight:700}

  .es__rule{display:flex;align-items:center;gap:14px;width:100%;margin:40px 0 24px}
  .es__rule span{font-size:10px;font-weight:800;letter-spacing:.22em;color:var(--fg40);white-space:nowrap}
  .es__rule i{flex:1;height:1px;background:var(--fg15)}

  /* instant start banner */
  .instant{width:100%;border:2px solid var(--tc);background:linear-gradient(180deg,var(--tc12),transparent);padding:24px 26px;display:flex;align-items:center;gap:24px;text-align:left}
  .instant__bolt{font-size:30px;line-height:1;color:var(--tc);flex-shrink:0}
  .instant__body{flex:1;min-width:0}
  .instant__k{font-size:9px;font-weight:800;letter-spacing:.22em;color:var(--tc);text-transform:uppercase}
  .instant__h{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.15;letter-spacing:-.01em;margin:6px 0 7px}
  .instant__p{font-size:11.5px;font-weight:500;color:var(--fg55);line-height:1.55;max-width:52ch}
  .instant__p b{color:var(--fg);font-weight:700}
  .btn{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:13px 20px;cursor:pointer;transition:.12s;white-space:nowrap;border:2px solid var(--tc)}
  .btn--fill{background:var(--tc);color:var(--bg)}
  .btn--fill:hover{background:var(--bg);color:var(--tc)}
  .btn--ghost{background:none;color:var(--fg);border-color:var(--fg)}
  .btn--ghost:hover{background:var(--fg);color:var(--bg)}
  .btn:disabled{opacity:.5;cursor:default}

  /* starter packs */
  .packs__head{width:100%;display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .packs__head .k{font-size:10px;font-weight:800;letter-spacing:.22em;color:var(--fg);white-space:nowrap}
  .packs__head i{flex:1;height:1px;background:var(--fg15)}
  .packs{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--fg15);border:1px solid var(--fg15)}
  .pack{background:var(--bg);padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left;position:relative}
  .pack__top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .pack__name{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em;line-height:1.1}
  .pack__count{font-size:8.5px;font-weight:800;letter-spacing:.14em;color:var(--fg40);white-space:nowrap;padding-top:5px}
  .pack__chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--fg55);border:1px solid var(--fg20);padding:3px 7px;white-space:nowrap}
  .chip--more{color:var(--fg40);border-color:var(--fg15)}
  .pack__foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px}
  .pack__cats{font-size:8.5px;font-weight:800;letter-spacing:.12em;color:var(--tc);text-transform:uppercase}
  .pack__add{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;background:none;border:1px solid var(--fg);color:var(--fg);padding:7px 12px;cursor:pointer;transition:.12s}
  .pack__add:hover{background:var(--fg);color:var(--bg)}
  .pack.added{outline:2px solid var(--tc);outline-offset:-2px}
  .pack.added .pack__add{background:var(--tc);border-color:var(--tc);color:var(--bg);cursor:default}

  /* fallback paths */
  .paths{width:100%;display:flex;flex-direction:column;gap:1px;background:var(--fg15);border:1px solid var(--fg15);margin-top:26px}
  .path{background:var(--bg);display:flex;align-items:center;gap:16px;padding:16px 20px;text-align:left;cursor:pointer;transition:.12s}
  .path:hover{background:var(--fg04)}
  .path__i{color:var(--tc);font-size:14px;width:18px;flex-shrink:0;text-align:center}
  .path__t{flex:1}
  .path__h{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--fg);text-transform:uppercase}
  .path__d{font-size:10px;font-weight:500;color:var(--fg40);letter-spacing:.03em;margin-top:3px}
  .path__arr{color:var(--fg30);font-size:13px}
  .path:hover .path__arr{color:var(--tc)}

  /* ─── working / done states ─── */
  .es__title.work{display:flex;flex-direction:column;align-items:center;gap:14px}
  .spinner{width:34px;height:34px;border:3px solid var(--fg15);border-top-color:var(--tc);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .donecheck{font-size:34px;color:var(--tc)}
  .es__loglist{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--fg40);line-height:1.9;margin-top:6px;text-align:center}
  .es__loglist .ok{color:var(--tc);margin-right:7px}
  .es__cta{display:flex;gap:12px;margin-top:30px}

  /* toast */
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:18px;background:var(--bg);border:2px solid var(--tc);padding:13px 18px;z-index:50;opacity:0;pointer-events:none;transition:.28s cubic-bezier(.3,.8,.3,1)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast__t{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--fg)}
  .toast__t b{color:var(--tc);font-weight:800}
  .toast__undo{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px solid var(--fg30);color:var(--fg);padding:6px 11px;cursor:pointer}
  .toast__undo:hover{background:var(--fg);color:var(--bg)}

  .hidden{display:none !important}

  @media (max-width:1100px){ .sb{display:none} }
  @media (max-width:680px){ .packs{grid-template-columns:1fr} .instant{flex-direction:column;align-items:flex-start;gap:16px} }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#000"/>
      <circle cx="34" cy="66" r="4" fill="#E2725B"/>
      <path d="M30 50a20 20 0 0 1 20 20M30 38a32 32 0 0 1 32 32" fill="none" stroke="#E2725B" stroke-width="5"/>
      <rect x="30" y="28" width="40" height="5" fill="#fff" opacity="0.5"/>
    </svg>
  </template>

  <div id="root"></div>

  <script>
  // ── starter packs (drawn from the app's curated SUGGESTED_FEEDS) ──
  const PACKS = [
    { id:'essentials', name:'The Essentials', cats:'Tech · News · Culture',
      feeds:['Hacker News','The Guardian','The Verge','BBC News','Noema Magazine','xkcd'] },
    { id:'tech', name:'Tech Daily', cats:'Tech',
      feeds:["Simon Willison's Weblog",'Hacker News','MIT News','The Verge'] },
    { id:'news', name:'News Desk', cats:'News',
      feeds:['Reuters','BBC News','The Guardian','Repubblica.it','Adnkronos'] },
    { id:'culture', name:'Culture & Ideas', cats:'Culture · Podcast',
      feeds:['Noema Magazine','The Ezra Klein Show','Guardian — Books','Lex Fridman'] },
  ];
  // category map used to populate the sidebar after adding
  const ADDED_CATS = [
    { name:'TECH',    sources:['Hacker News','The Verge','MIT News'] },
    { name:'NEWS',    sources:['The Guardian','BBC News','Reuters'] },
    { name:'CULTURE', sources:['Noema Magazine','xkcd'] },
  ];

  const root = document.getElementById('root');

  function chip(label, more){ return `<span class="chip ${more?'chip--more':''}">${label}</span>`; }

  function packCard(p){
    const shown = p.feeds.slice(0,3);
    const rest = p.feeds.length - shown.length;
    return `
      <div class="pack" data-pack="${p.id}">
        <div class="pack__top">
          <div class="pack__name">${p.name}</div>
          <div class="pack__count">${String(p.feeds.length).padStart(2,'0')} FEEDS</div>
        </div>
        <div class="pack__chips">
          ${shown.map(f=>chip(f)).join('')}
          ${rest>0?chip('+'+rest+' more',true):''}
        </div>
        <div class="pack__foot">
          <span class="pack__cats">${p.cats}</span>
          <button class="pack__add" data-add="${p.id}">+ Add pack</button>
        </div>
      </div>`;
  }

  function sidebarEmpty(){
    return `
      <span class="lbl muted sb__catlbl">CATEGORIES</span>
      <div class="sb__empty">
        <div class="sb__emptyrow"></div>
        <div class="sb__emptyrow"></div>
        <div class="sb__emptyrow"></div>
        <div class="sb__emptynote">NO SOURCES YET —<br>add a pack to populate</div>
      </div>`;
  }
  function sidebarFull(){
    return `<span class="lbl muted sb__catlbl">CATEGORIES</span>` + ADDED_CATS.map(c=>`
      <div class="sbcat">
        <div class="sbcat__head"><span class="lbl">${c.name}</span><span class="lbl sbcat__n">${String(c.sources.length).padStart(2,'0')}</span></div>
        <div class="sbcat__src">${c.sources.map(s=>`<div class="sbcat__s">${s}</div>`).join('')}</div>
      </div>`).join('');
  }

  function shell(inner, full){
    return `
    <div class="app">
      <aside class="sb">
        <div class="sb__brand"><img src="assets/multivrss-ico.png" alt="" class="sb__logo"><span class="sb__name">multivrss</span></div>
        <div class="sb__sync"><span class="sb__dot ${full?'live':''}"></span> ${full?'LAST SYNC 0M AGO':'AWAITING FIRST SOURCE'}</div>
        <nav class="sb__nav">
          <span class="lbl muted">NAV_ROOT</span>
          <div class="navitem active"><span class="navitem__i">${RSS}</span><span class="navitem__l">All Feeds</span></div>
          <div class="navitem"><span class="navitem__i">${BK}</span><span class="navitem__l">Saved</span></div>
          <div class="navitem"><span class="navitem__i">${DISC}</span><span class="navitem__l">Suggested</span></div>
          <div id="sbcats">${full?sidebarFull():sidebarEmpty()}</div>
        </nav>
        <div class="sb__foot lbl">Connection: [PROTECTED]<br>Node: MULTIVRSS_ALPHA</div>
      </aside>
      <div class="main">
        <header class="top">
          <div class="flex1"></div>
          <div class="search"><span class="search__q">Q</span><span class="search__ph">filter the stream...</span></div>
          <div class="ingest"><span class="ingest__plus">+</span><button class="ingest__b">SOURCE</button><button class="ingest__b">URL</button></div>
          <button class="top__sync">↻ SYNC</button>
          <span class="top__ico">◑</span><span class="top__ico">⚙</span>
        </header>
        <div class="scroll"><main class="content">${inner}</main></div>
      </div>
    </div>
    <div class="toast" id="toast">
      <span class="toast__t"><b id="toastN">6</b> SOURCES ADDED · syncing…</span>
      <button class="toast__undo" id="undo">Undo</button>
    </div>`;
  }

  const RSS = `<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="2" cy="10" r="1.4" fill="currentColor"/><path d="M1 5.5a5.5 5.5 0 0 1 5.5 5.5M1 1.5A9.5 9.5 0 0 1 10.5 11" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
  const BK  = `<svg width="11" height="14" viewBox="0 0 12 15"><path d="M1 1h10v12.4l-5-3.1-5 3.1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
  const DISC= `<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.2 3.8 6.6 6.6 3.8 8.2 5.4 5.4z" fill="currentColor"/></svg>`;

  // ── EMPTY STATE (idle) ──
  function emptyState(){
    return `
    <div class="es" id="es">
      <img src="assets/multivrss-ico.png" alt="" class="es__mark">
      <div class="es__word">multivrss</div>
      <div class="es__signal"><span class="d"></span> 00 SOURCES · STANDBY</div>
      <h1 class="es__title">No signal yet.</h1>
      <p class="es__sub">Feed the reader. Drop in a <b>starter pack</b> and the stream comes alive — or wire up sources by hand.</p>

      <div class="es__rule"><span>FASTEST WAY IN</span><i></i></div>

      <div class="instant">
        <div class="instant__bolt">⚡</div>
        <div class="instant__body">
          <div class="instant__k">One-command setup</div>
          <div class="instant__h">Load the Essentials</div>
          <div class="instant__p"><b>6 curated sources</b>, auto-sorted into categories. Executes in one click. Reversible.</div>
        </div>
        <button class="btn btn--fill" data-add="essentials" id="instantBtn">+ Load Essentials</button>
      </div>

      <div class="es__rule"><span>OR PICK A PACK</span><i></i></div>
      <div class="packs__head hidden"></div>
      <div class="packs">${PACKS.map(packCard).join('')}</div>

      <div class="paths">
        <div class="path" data-nav="suggested">
          <span class="path__i">${DISC}</span>
          <div class="path__t"><div class="path__h">Open the directory</div><div class="path__d">40+ curated sources, organised by topic — add them one by one.</div></div>
          <span class="path__arr">→</span>
        </div>
        <div class="path" data-nav="url">
          <span class="path__i">+</span>
          <div class="path__t"><div class="path__h">Pipe in a URL</div><div class="path__d">Already know a site you love? Drop its RSS / Atom link.</div></div>
          <span class="path__arr">→</span>
        </div>
      </div>
    </div>`;
  }

  // ── WORKING state ──
  function workingState(pack){
    return `
    <div class="es">
      <img src="assets/multivrss-ico.png" alt="" class="es__mark" style="opacity:.5">
      <div class="es__word">multivrss</div>
      <div class="es__title work" style="margin-top:34px">
        <div class="spinner"></div>
        <span style="font-size:26px">Adding ${pack.name}…</span>
      </div>
      <div class="es__loglist" id="log"></div>
    </div>`;
  }

  // ── DONE state ──
  function doneState(pack){
    return `
    <div class="es">
      <img src="assets/multivrss-ico.png" alt="" class="es__mark">
      <div class="es__word">multivrss</div>
      <div class="es__signal" style="border-color:var(--tc)"><span class="d" style="animation:pulse 2s infinite"></span> SIGNAL ACQUIRED</div>
      <h1 class="es__title" style="margin-top:20px"><span class="donecheck">✓</span><br>You're all set.</h1>
      <p class="es__sub"><b>${pack.feeds.length} sources</b> from <b>${pack.name}</b> are now syncing. Your front page is being assembled from the first articles.</p>
      <div class="es__cta">
        <button class="btn btn--fill" data-nav="front">Go to my front page →</button>
        <button class="btn btn--ghost" data-add="more">Add another pack</button>
      </div>
    </div>`;
  }

  // ── state ──
  let added = [];   // pack ids
  let view = 'empty';

  function render(){
    const full = added.length>0;
    let inner;
    if(view==='empty') inner = emptyState();
    else if(view==='working') inner = workingState(currentPack);
    else if(view==='done') inner = doneState(currentPack);
    else inner = frontStub();
    root.innerHTML = shell(inner, full && view!=='empty');
    bind();
    // re-mark packs already added in empty view
    if(view==='empty'){
      added.forEach(id=>{
        const el=root.querySelector(`[data-pack="${id}"]`);
        if(el){ el.classList.add('added'); const b=el.querySelector('[data-add]'); if(b){b.textContent='✓ Added';} }
      });
    }
  }

  let currentPack=null;
  function frontStub(){
    return `<div class="es"><div class="es__word" style="margin-top:30px">your front page</div>
      <p class="es__sub" style="margin-top:18px">[ front page renders here — see the main prototype ]</p>
      <div class="es__cta"><button class="btn btn--ghost" data-nav="reset">↺ Back to empty state</button></div></div>`;
  }

  function addPack(id){
    const pack = PACKS.find(p=>p.id===id);
    currentPack = pack;
    view='working';
    render();
    const log = document.getElementById('log');
    let i=0;
    const step=()=>{
      if(i<pack.feeds.length){
        const line=document.createElement('div');
        line.innerHTML=`<span class="ok">✓</span>${pack.feeds[i]}`;
        log.appendChild(line);
        i++; setTimeout(step, 240);
      } else {
        if(!added.includes(id)) added.push(id);
        setTimeout(()=>{ view='done'; render(); showToast(pack.feeds.length); }, 420);
      }
    };
    setTimeout(step, 350);
  }

  let toastTimer=null;
  function showToast(n){
    const t=document.getElementById('toast');
    document.getElementById('toastN').textContent=n;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove('show'), 6000);
  }

  function bind(){
    root.querySelectorAll('[data-add]').forEach(b=>{
      b.addEventListener('click',()=>{
        const id=b.getAttribute('data-add');
        if(id==='more'){ view='empty'; render(); return; }
        if(b.closest('.pack') && b.closest('.pack').classList.contains('added')) return;
        addPack(id);
      });
    });
    root.querySelectorAll('[data-nav]').forEach(b=>{
      b.addEventListener('click',()=>{
        const n=b.getAttribute('data-nav');
        if(n==='front'){ view='front'; render(); }
        else if(n==='reset'){ added=[]; view='empty'; render(); }
        // suggested / url are stubs — no-op in this mockup
      });
    });
    const undo=document.getElementById('undo');
    if(undo) undo.addEventListener('click',()=>{
      added=[]; view='empty'; render();
      document.getElementById('toast')?.classList.remove('show');
    });
  }

  render();
  </script>
</body>
</html>
