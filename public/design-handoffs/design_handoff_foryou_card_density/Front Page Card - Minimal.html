<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MultivRSS — For You card · density studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#000; --fg:#fff; --tc:#E2725B;
    --fg70:rgba(255,255,255,.7); --fg55:rgba(255,255,255,.55); --fg40:rgba(255,255,255,.4);
    --fg30:rgba(255,255,255,.3); --fg20:rgba(255,255,255,.2); --fg15:rgba(255,255,255,.15); --fg08:rgba(255,255,255,.08);
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --serif:"Newsreader",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#161514;font-family:var(--mono)}

  /* a strip = the real .strip__row context: 4 cards, hairline gaps */
  .fpc-frame{background:#000;border:1px solid var(--fg15)}
  .fpc-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--fg15);align-items:stretch}
  .fpc{background:#000;padding:15px 15px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}

  .fpc__top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:16px}
  .fpc-cat{font-size:8.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--tc);border:1px solid rgba(226,114,91,.4);padding:2px 6px;white-space:nowrap}
  .fpc__glyph{color:var(--tc);font-size:11px;line-height:1}
  .fpc__glyph--sm{font-size:9.5px}

  .fpc__title{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.28;letter-spacing:-.005em;color:var(--fg);margin:0;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  .fpc__foot{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:3px;min-height:18px}
  .fpc__src{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--fg40);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .fpc__src--tc{color:var(--tc)}
  .fpc__mid{color:var(--fg20);font-size:9px}
  .fpc__date{font-size:9px;color:var(--fg40);font-family:var(--mono);white-space:nowrap}
  .fpc__actions{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0}

  .fpc-tag{background:transparent;border:1px solid currentColor;font-family:var(--mono);font-size:9px;font-weight:800;text-transform:uppercase;color:var(--fg30);padding:1px 4px;line-height:1.3;cursor:pointer;transition:.12s;white-space:nowrap}
  .fpc-tag:hover{color:var(--fg)}
  .fpc-read{color:var(--fg20);font-size:10px;cursor:pointer}
  .fpc-save{color:var(--fg30);cursor:pointer;transition:.12s;display:inline-flex;align-items:center}
  .fpc-save:hover{color:var(--tc)}
  .fpc-save.on{color:var(--tc)}

  /* baseline reason row */
  .fpc__reason{display:flex;align-items:center;gap:6px;min-height:14px}
  .fpc__rtxt{font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--fg55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fpc-bar{position:relative;width:34px;height:4px;background:var(--fg15);display:block;flex-shrink:0;margin-left:auto}
  .fpc-fill{position:absolute;inset:0 auto 0 0;background:var(--tc)}
  .fpc__pct{font-size:8.5px;font-weight:800;color:var(--fg40);flex-shrink:0}

  /* A · hover reveal */
  .fpc--a .fpc__actions--hover{opacity:0;transform:translateX(4px);transition:.16s;pointer-events:none}
  .fpc--a:hover .fpc__actions--hover,.fpc--a.is-hover .fpc__actions--hover{opacity:1;transform:none;pointer-events:auto}
  .fpc--a.is-hover{outline:1px solid var(--fg15);outline-offset:-1px}

  /* B · mini strength meter */
  .fpc-meter{display:inline-flex;gap:2px;align-items:center}
  .fpc-meter__t{width:3px;height:8px;background:var(--fg15);display:block}
  .fpc-meter__t.on{background:var(--tc)}

  /* C · save-first */
  .fpc__why{font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--fg30)}
  .fpc-addtag{background:transparent;border:none;font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--tc);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

  /* caption note inside artboards */
  .note{font-family:var(--mono);font-size:11px;line-height:1.55;color:#b8b2aa;padding:14px 4px 0}
  .note b{color:#fff;font-weight:700}
  .note .k{color:var(--tc);font-weight:800;letter-spacing:.06em}
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#000"/>
      <rect x="30" y="30" width="26" height="5" fill="#E2725B"/>
      <rect x="30" y="42" width="40" height="3" fill="#fff" opacity=".6"/>
      <rect x="30" y="49" width="34" height="3" fill="#fff" opacity=".3"/>
      <rect x="30" y="64" width="14" height="3" fill="#fff" opacity=".35"/>
      <rect x="58" y="64" width="12" height="3" fill="#E2725B"/>
    </svg>
  </template>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="card-minimal.jsx"></script>
  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { Strip, CardBaseline, CardA, CardB, CardC } = window;

    function Frame({ children }) { return <div className="fpc-frame"><div className="fpc-strip">{children}</div></div>; }

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="cards" title="For You · density studies"
            subtitle="Lo stesso strip a 4 card, dalla versione attuale (densa) a tre direzioni più minimali. Footer = il punto da alleggerire.">

            <DCArtboard id="baseline" label="ATTUALE · 2 righe di meta + barra affinità (denso)" width={1180} height={250}>
              <div className="fpc-frame"><div className="fpc-strip">{window.FY.map((it,i)=><CardBaseline key={i} it={it} />)}</div></div>
              <div className="note"><span className="k">Cosa pesa:</span> sotto al titolo ci sono <b>due righe</b> con fino a 8 segnali — <b>source · data · +TAG · ● · ◇</b> e poi <b>glifo · testo · barra · numero</b>. A ¼ di larghezza competono tutti.</div>
            </DCArtboard>

            <DCArtboard id="varA" label="A · Quiet — azioni solo all'hover" width={1180} height={250}>
              <div className="fpc-frame"><div className="fpc-strip">{window.FY.map((it,i)=><CardA key={i} it={it} hover={i===0} />)}</div></div>
              <div className="note"><span className="k">A · consigliata:</span> a riposo la card mostra solo <b>contenuto + source · data</b>, nessun simbolo accanto al titolo. <b>+TAG</b> e la <b>bookmark di salvataggio</b> (la stessa del river) compaiono <b>all'hover</b> (1ª card mostrata aperta). Niente rombo, niente barra, niente pallino read.</div>
            </DCArtboard>

            <DCArtboard id="varB" label="B · One line — meta unite su una riga" width={1180} height={250}>
              <div className="fpc-frame"><div className="fpc-strip">{window.FY.map((it,i)=><CardB key={i} it={it} />)}</div></div>
              <div className="note"><span className="k">B · azioni sempre visibili ma ordinate:</span> una sola riga — <b>mini-meter</b> (3 tacche = forza del match, niente numero) · source · poi <b>bookmark + TAG</b> a destra. Tolti rombo, pallino read e barra. Compatta ma esplicita.</div>
            </DCArtboard>

            <DCArtboard id="varC" label="C · Save-first — il tag nasce dal salvataggio" width={1180} height={250}>
              <div className="fpc-frame"><div className="fpc-strip">{window.FY.map((it,i)=><CardC key={i} it={it} saved={i===0} />)}</div></div>
              <div className="note"><span className="k">C · meno controlli possibili:</span> a riposo solo la <b>bookmark</b> (come nel river). Il «perché» è una <b>parola</b> accanto alla categoria — niente simboli. Quando salvi (1ª card) la <b>bookmark si riempie</b> e appare <b>＋ tag</b>: si tagga ciò che si salva, non tutto.</div>
            </DCArtboard>

          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
