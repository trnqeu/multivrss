<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MultivRSS — Front Page, calm</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f6f3ec; --fg:#000; --tc:#E2725B;
    --fg70:rgba(0,0,0,.70); --fg55:rgba(0,0,0,.55); --fg45:rgba(0,0,0,.45);
    --fg35:rgba(0,0,0,.35); --fg22:rgba(0,0,0,.22); --fg14:rgba(0,0,0,.14);
    --fg09:rgba(0,0,0,.09); --fg05:rgba(0,0,0,.05);
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --serif:"Newsreader",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-font-smoothing:antialiased}
  #root{height:100%}
  .flex1{flex:1}
  .tc{color:var(--tc)}

  .app{display:flex;height:100%;overflow:hidden}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--fg22) transparent}
  .scroll::-webkit-scrollbar{width:10px}
  .scroll::-webkit-scrollbar-thumb{background:var(--fg14)}

  /* ───────── sidebar ───────── */
  .sb{width:236px;flex-shrink:0;border-right:2px solid var(--fg);display:flex;flex-direction:column;background:var(--bg)}
  .sb__brand{display:flex;align-items:center;gap:12px;padding:20px 22px;border-bottom:2px solid var(--fg)}
  .sb__logo{width:30px;height:30px;object-fit:contain}
  .sb__name{font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--tc)}
  .sb__nav{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:3px;scrollbar-width:none}
  .sb__nav::-webkit-scrollbar{display:none}
  .navitem{display:flex;align-items:center;gap:13px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);padding:8px 10px;cursor:pointer;border-radius:2px;transition:.12s}
  .navitem:hover{background:var(--fg05)}
  .navitem.active{color:var(--tc)}
  .navitem__i{display:flex;width:14px;color:currentColor;opacity:.85}
  .navitem__l{flex:1}
  .navitem__c{font-size:10px;font-weight:700;color:var(--fg35)}
  .sb__cats{margin-top:18px;padding-top:16px;border-top:1px solid var(--fg14);display:flex;flex-direction:column}
  .sbcat{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;cursor:pointer;border-radius:2px;transition:.12s}
  .sbcat:hover{background:var(--fg05)}
  .sbcat__n{font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--fg55)}
  .sbcat:hover .sbcat__n{color:var(--fg)}
  .sbcat__c{font-size:10px;font-weight:700;color:var(--fg22)}

  /* ───────── top bar ───────── */
  .top{display:flex;align-items:center;gap:14px;height:58px;flex-shrink:0;border-bottom:2px solid var(--fg);padding:0 24px;background:var(--bg)}
  .search{display:flex;align-items:center;gap:9px;min-width:240px;height:32px;padding:0 12px;border:1px solid var(--fg22);border-radius:2px}
  .search__q{color:var(--fg35);font-size:11px;font-weight:800}
  .search__ph{color:var(--fg35);font-size:11px;font-weight:500;letter-spacing:.04em}
  .tabs{display:flex;gap:2px}
  .tab{background:none;border:0;color:var(--fg35);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;transition:.12s}
  .tab:hover{color:var(--fg)}
  .tab.on{color:var(--fg);border-bottom-color:var(--tc)}
  .tbtn{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--fg55);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 4px;cursor:pointer;transition:.12s}
  .tbtn:hover{color:var(--fg)}
  .tbtn__plus{color:var(--tc);font-size:14px;font-weight:700}
  .tbtn--ghost{color:var(--fg35)}
  .tico{color:var(--fg35);font-size:15px;cursor:pointer;transition:.12s}
  .tico:hover{color:var(--fg)}

  /* ═════════ FRONT PAGE ═════════ */
  .fp{max-width:1180px;margin:0 auto;padding:0 40px 100px}

  /* masthead */
  .mast{padding:38px 0 0}
  .mast__title{font-family:var(--serif);font-weight:600;font-size:46px;letter-spacing:-.02em;line-height:1;text-transform:uppercase}
  .mast__rule{height:2px;background:var(--fg);margin:18px 0 12px}
  .mast__meta{display:flex;align-items:center;flex-wrap:wrap;gap:0 8px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg45);font-family:var(--mono)}
  .mast__meta b{color:var(--fg70);font-weight:800}
  .mast__meta--legend{margin-top:5px}
  .mast__dot{color:var(--fg22)}
  .mast__line b{color:var(--fg);font-weight:800}

  /* FOR YOU */
  .band{padding:34px 0 0}
  .band__head,.sect__head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
  .band__kick{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
  .band__line,.sect__line{flex:1;height:1px;background:var(--fg14)}
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
  .card{display:flex;flex-direction:column;gap:11px;min-width:0;border-top:2px solid var(--fg);padding-top:14px}
  .card__cat{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--tc)}
  .card__title{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.2;letter-spacing:-.01em;cursor:pointer;transition:.12s}
  .card__title:hover{color:var(--tc)}
  .card__foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px;min-height:20px}

  /* meta (source · date) */
  .meta{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
  .meta__src{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta__src--tc{color:var(--tc)}
  .meta__dot{color:var(--fg22);font-size:9px}
  .meta__date{font-size:9.5px;font-weight:600;color:var(--fg35);white-space:nowrap}

  /* why removed */

  /* hover-reveal actions */
  .acts{display:flex;align-items:center;gap:9px;flex-shrink:0;opacity:0;transition:opacity .14s}
  .act{display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--fg35);cursor:pointer;font-family:var(--mono);transition:color .12s;padding:0}
  .act:hover{color:var(--tc)}
  .act--tag{font-size:14px;font-weight:600}
  .act--x{font-size:16px;line-height:1}
  .card:hover .acts,.lead:hover .acts,.row:hover .acts{opacity:1}

  /* category sections */
  .sects{margin-top:18px;display:flex;flex-direction:column}
  .sect{padding:34px 0}
  .sect__foot{display:flex;justify-content:flex-end;margin-top:24px}
  .sect__name{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;color:var(--tc)}
  .sect__all{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--fg55);border:1px solid var(--fg22);border-radius:2px;padding:6px 11px;cursor:pointer;white-space:nowrap;transition:.12s}
  .sect__all:hover{color:var(--tc);border-color:var(--tc)}
  .sect__all__arr{transition:transform .16s}
  .sect__all:hover .sect__all__arr{transform:translateX(3px)}
  .sect__body{display:grid;grid-template-columns:1.45fr 1fr;gap:48px}

  .lead{display:flex;flex-direction:column;gap:11px;align-items:flex-start;min-width:0}
  .lead__title{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.14;letter-spacing:-.015em;cursor:pointer;transition:.12s}
  .lead__title:hover{color:var(--tc)}
  .lead__dek{font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--fg55);font-weight:400;max-width:50ch}
  .lead__foot{display:flex;align-items:center;gap:12px;margin-top:3px;width:100%;min-height:20px}

  .list{list-style:none;display:flex;flex-direction:column;border-top:1px solid var(--fg14)}
  .row{padding:15px 0;border-bottom:1px solid var(--fg09);display:flex;flex-direction:column;gap:8px}
  .row:last-child{border-bottom:0}
  .row__title{font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.26;color:var(--fg);cursor:pointer;transition:.12s}
  .row__title:hover{color:var(--tc)}
  .row__foot{display:flex;align-items:center;gap:12px;min-height:18px}

  /* ── ACCENT: everywhere (old, busy) puts terracotta back on chips & dashes ── */
  .accent-everywhere .sect__name::before,
  .accent-everywhere .band__kick::before{content:"— ";color:var(--tc)}
  .accent-everywhere .sect__all{color:var(--tc)}

  /* ── CHROME: busy makes every affordance always-on (the current state) ── */
  .chrome-busy .acts{opacity:1}
  .chrome-busy .card__cat{border:1px solid var(--tc);padding:2px 6px;align-self:flex-start}

  @media (max-width:1180px){
    .fp{padding:0 28px 90px}
    .strip{grid-template-columns:repeat(2,1fr)}
    .sect__body{grid-template-columns:1fr;gap:24px}
  }
  @media (max-width:760px){
    .sb{display:none}
    .strip{grid-template-columns:1fr}
    .top{gap:8px;padding:0 14px}
    .search{min-width:0;flex:0 0 auto;padding:0 8px}
    .search__ph{display:none}
    .tbtn--source,.tbtn--url{display:none}
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#f6f3ec"/>
      <rect x="30" y="30" width="40" height="5" fill="#000"/>
      <rect x="30" y="40" width="40" height="2" fill="#E2725B"/>
      <rect x="30" y="50" width="40" height="2" fill="#000" opacity="0.25"/>
      <rect x="30" y="58" width="28" height="2" fill="#000" opacity="0.25"/>
      <rect x="30" y="68" width="18" height="2" fill="#000" opacity="0.15"/>
    </svg>
  </template>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="frontpage/data.js"></script>
  <script type="text/babel" src="frontpage/tweaks-panel.jsx"></script>
  <script type="text/babel" src="frontpage/calm.jsx"></script>
  <script type="text/babel" src="frontpage/calm-app.jsx"></script>
</body>
</html>
