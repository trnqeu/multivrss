<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Save URL on Dashboard — MultivRSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f6f3ec;
    --ink: #000000;
    --tc: #E2725B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }

  /* ============ DASHBOARD SHELL ============ */
  .dash {
    display: flex;
    width: 100%;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
  }
  .label-system { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; }
  .tc { color: var(--tc); }
  .muted { color: rgba(0,0,0,0.45); }
  .flex-1 { flex: 1; }

  /* ---- Sidebar ---- */
  .sidebar { width: 248px; flex-shrink: 0; border-right: 2px solid var(--ink); display: flex; flex-direction: column; background: var(--paper); }
  .brand { padding: 20px 22px 14px; border-bottom: 2px solid var(--ink); display: flex; align-items: center; gap: 12px; }
  .brand__logo { width: 36px; height: 36px; object-fit: contain; }
  .brand__name { font-size: 17px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.18em; color: var(--tc); }
  .sync-badge { padding: 8px 22px; border-bottom: 2px solid var(--ink); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(0,0,0,0.5); display: flex; align-items: center; gap: 7px; }
  .sync-badge .dot { width: 6px; height: 6px; background: var(--tc); border-radius: 50%; }
  .nav { flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .nav__group { display: block; margin-bottom: 2px; }
  .nav__group--cats { margin-top: 14px; }
  .nav-item { display: flex; align-items: center; gap: 11px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding-left: 8px; border-left: 2px solid transparent; height: 18px; }
  .nav-item.active { border-left-color: var(--ink); }
  .nav-item__icon { display: inline-flex; }
  .nav-item__label { flex: 1; }
  .nav-item__count { font-size: 10px; font-weight: 700; color: rgba(0,0,0,0.4); }
  .cat { display: flex; flex-direction: column; gap: 8px; }
  .cat__head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid rgba(0,0,0,0.15); }
  .cat__count { color: rgba(0,0,0,0.4); }
  .cat__sources { display: flex; flex-direction: column; gap: 7px; padding-left: 2px; }
  .cat__source { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: rgba(0,0,0,0.62); }
  .sidebar__footer { padding: 18px 22px; border-top: 2px solid var(--ink); font-size: 9px; line-height: 1.5; color: var(--ink); }

  /* ---- Top bar ---- */
  .dash__main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .topbar { display: flex; align-items: center; height: 54px; flex-shrink: 0; border-bottom: 2px solid var(--ink); padding: 0 22px; gap: 18px; }
  .search { display: flex; align-items: center; min-width: 250px; height: 30px; padding: 0 11px; border: 1px solid rgba(0,0,0,0.2); }
  .search__q { color: var(--tc); font-size: 10px; font-weight: 700; margin-right: 9px; }
  .search__ph { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(0,0,0,0.3); }
  .topbar__btn { background: transparent; border: 1px solid rgba(0,0,0,0.3); color: var(--ink); font-size: 10px; letter-spacing: 0.1em; padding: 5px 11px; text-transform: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .topbar__btn--link { border-color: var(--tc); color: var(--tc); }
  .topbar__sync { background: transparent; border: none; color: var(--tc); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; }
  .topbar__theme, .topbar__settings { color: var(--ink); font-size: 14px; }

  /* ---- Content ---- */
  .content { flex: 1; min-height: 0; overflow: hidden; }
  .content__savezone { padding: 16px 28px; border-bottom: 2px solid var(--ink); }
  .strip { padding: 14px 22px; border-bottom: 2px solid var(--ink); background: rgba(226,114,91,0.05); }
  .telemetry { padding: 11px 28px; border-bottom: 2px solid var(--ink); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(0,0,0,0.5); }
  .telemetry b { color: var(--ink); }
  .telemetry .tg { margin: 0 12px; }
  .telemetry .tg-s { margin: 0 5px; color: rgba(0,0,0,0.3); }
  .telemetry .tc-u { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--tc); }
  .telemetry .tg-d { color: rgba(0,0,0,0.3); }
  .content__river { padding: 26px 28px; }
  .daymark { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .daymark__label { font-size: 9.5px; font-weight: 800; letter-spacing: 0.32em; color: var(--tc); }
  .daymark__line { flex: 1; height: 1px; background: rgba(226,114,91,0.35); }
  .daymark__arrow { font-size: 9px; color: rgba(0,0,0,0.3); }
  .river { font-size: 13.5px; line-height: 1.85; font-weight: 500; color: var(--ink); }
  .river__item.is-read { opacity: 0.3; }
  .river__dot { color: var(--tc); margin-right: 5px; font-size: 13px; }
  .river__src { color: var(--tc); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
  .river__mid { color: rgba(0,0,0,0.4); margin: 0 8px; }
  .river__date { color: rgba(0,0,0,0.5); font-size: 12px; }
  .river__dash { color: rgba(0,0,0,0.4); margin: 0 8px; }
  .river__body { color: rgba(0,0,0,0.5); font-size: 12.5px; font-weight: 400; }
  .river__bk { color: rgba(0,0,0,0.4); margin-left: 8px; }
  .river__slash { color: var(--tc); font-weight: 700; margin: 0 12px; }

  /* ============ THE SAVE BAR (recreated from SaveLinkBar.tsx) ============ */
  .save-bar { display: flex; align-items: stretch; border: 2px solid rgba(0,0,0,0.15); background: var(--paper); transition: border-color 0.15s; }
  .save-bar.is-focus { border-color: var(--ink); }
  .save-bar__tag { display: flex; align-items: center; padding: 0 13px; border-right: 1px solid rgba(0,0,0,0.15); }
  .save-bar__tag .label-system { font-size: 9.5px; }
  .save-bar__field { flex: 1; display: flex; align-items: center; padding: 13px 15px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; min-width: 0; }
  .save-bar__ph { color: rgba(0,0,0,0.4); }
  .save-bar__val { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caret { display: inline-block; width: 1px; height: 14px; background: var(--ink); margin-left: 1px; vertical-align: middle; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  .save-bar__btn { display: inline-flex; align-items: center; gap: 7px; padding: 0 18px; border: none; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; cursor: pointer; }
  .save-bar__btn.off { background: rgba(226,114,91,0.2); color: rgba(0,0,0,0.4); }
  .save-bar__btn.on { background: var(--tc); color: var(--paper); }

  /* ---- Toast ---- */
  .toast { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 11px 18px; border: 2px solid var(--ink); background: var(--paper); color: var(--tc); }
  .toast .label-system { color: var(--tc); }
  .toast__sep { color: rgba(0,0,0,0.3); }
  .toast__title { color: var(--ink); font-size: 12px; font-weight: 600; }

  /* ============ TOP-BAR VARIANTS ============ */
  .hf { display: flex; flex-direction: column; height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
  .topbar--v { height: 56px; }
  .topbar--tall { height: auto; flex-direction: column; align-items: stretch; padding: 0; }
  .topbar--tall .tb-row { display: flex; align-items: center; height: 56px; padding: 0 22px; gap: 16px; }
  .tb-div { width: 1px; height: 22px; background: rgba(0,0,0,0.18); margin: 0 2px; }

  /* V1 textual */
  .tb-text { display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 1px solid rgba(0,0,0,0.28); color: var(--ink); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; padding: 6px 12px; cursor: pointer; transition: all 0.12s; text-transform: uppercase; }
  .tb-text:hover { border-color: var(--ink); }
  .tb-text--tc { border-color: rgba(226,114,91,0.55); color: var(--tc); }
  .tb-text--tc:hover { border-color: var(--tc); background: rgba(226,114,91,0.08); }
  .tb-text.is-active { background: var(--tc); color: var(--paper); border-color: var(--tc); }
  .tb-text--solo { }

  /* V2 icon + hover/focus label */
  .tb-icon { display: inline-flex; align-items: center; background: transparent; border: 1px solid rgba(0,0,0,0.28); color: var(--ink); height: 32px; padding: 0; cursor: pointer; overflow: hidden; transition: border-color 0.12s; }
  .tb-icon__g { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; }
  .tb-icon__l { max-width: 0; opacity: 0; white-space: nowrap; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; transition: max-width 0.22s ease, opacity 0.18s, padding 0.22s; }
  .tb-icon:hover, .tb-icon:focus-visible, .tb-icon.is-open { border-color: var(--ink); }
  .tb-icon:hover .tb-icon__l, .tb-icon:focus-visible .tb-icon__l, .tb-icon.is-open .tb-icon__l { max-width: 90px; opacity: 1; padding-right: 12px; }
  .tb-icon--tc { color: var(--tc); border-color: rgba(226,114,91,0.5); }

  /* V3 segmented ingest group */
  .tb-seg { display: inline-flex; border: 1px solid rgba(0,0,0,0.28); }
  .tb-seg__b { display: inline-flex; align-items: center; gap: 7px; background: transparent; border: none; border-right: 1px solid rgba(0,0,0,0.18); color: var(--ink); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; padding: 7px 13px; cursor: pointer; text-transform: uppercase; transition: background 0.12s; }
  .tb-seg__b:last-child { border-right: none; }
  .tb-seg__b:hover { background: var(--ink); color: var(--paper); }

  /* V4 popover */
  .tb-pop { padding: 14px 22px; border-top: 2px solid var(--ink); background: rgba(226,114,91,0.05); }

  /* shared frame below header */
  .hf__below { position: relative; flex: 1; }
  .hf__below .telemetry { border-top: 0; }
  .hf__river { padding: 22px 28px; font-size: 13px; font-weight: 500; line-height: 1.8; color: var(--ink); }
  .hf__fade { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(to bottom, rgba(246,243,236,0), var(--paper)); }

  /* ============ STATE DETAIL CARDS ============ */
  .state-card { display: flex; flex-direction: column; height: 100%; background: var(--paper); color: var(--ink); }
  .state-card__hd { padding: 14px 18px; border-bottom: 2px solid var(--ink); display: flex; align-items: center; justify-content: space-between; }
  .state-card__name { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.14em; }
  .state-card__tag { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--tc); border: 1px solid var(--tc); padding: 2px 6px; }
  .state-card__body { flex: 1; display: flex; align-items: center; padding: 26px 18px; }
  .state-card__body .save-bar { width: 100%; }
  .state-card__note { padding: 12px 18px; border-top: 1px solid rgba(0,0,0,0.15); font-size: 11px; font-weight: 500; color: rgba(0,0,0,0.6); line-height: 1.5; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="topbar-variants.jsx"></script>
<script type="text/babel">
  const { useState } = React;

  function StateCard({ name, tag, state, note }) {
    return (
      <div className="state-card">
        <div className="state-card__hd">
          <span className="state-card__name">{name}</span>
          <span className="state-card__tag">{tag}</span>
        </div>
        <div className="state-card__body">
          <SaveBar state={state} />
        </div>
        <div className="state-card__note">{note}</div>
      </div>
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="topbar" title="Barra superiore — trattamenti" subtitle="Dove e come vive «paste url» tra le azioni dell'header">
          <DCArtboard id="tb-v1" label="V1 · Tre azioni testuali (source · paste url · sync)" width={900} height={250}>
            <HeaderFrame><HeaderTextual /></HeaderFrame>
          </DCArtboard>
          <DCArtboard id="tb-v2" label="V2 · Solo icone, label su hover + focus (PASTE URL aperto)" width={900} height={250}>
            <HeaderFrame><HeaderIconHover /></HeaderFrame>
          </DCArtboard>
          <DCArtboard id="tb-v3" label="V3 · Consigliata — ingest raggruppato (SOURCE | URL) + SYNC a parte" width={900} height={250}>
            <HeaderFrame><HeaderSegmented /></HeaderFrame>
          </DCArtboard>
          <DCArtboard id="tb-v4" label="V4 · PASTE URL cliccato → barra inline (popover)" width={900} height={320}>
            <HeaderFrame><HeaderExpanded /></HeaderFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="placement" title="Posizionamento sulla dashboard" subtitle="Dove vive la barra «salva URL» nella pagina /u/{username}">
          <DCArtboard id="opt-a" label="A · Inline, sempre visibile" width={1180} height={760}>
            <Dashboard variant="A" barState="default" />
          </DCArtboard>
          <DCArtboard id="opt-a-focus" label="A · URL incollato, pronto a salvare" width={1180} height={760}>
            <Dashboard variant="A" barState="focus" />
          </DCArtboard>
          <DCArtboard id="opt-b" label="B · Strip dall'header (toggle «+ LINK»)" width={1180} height={760}>
            <Dashboard variant="B" barState="focus" />
          </DCArtboard>
          <DCArtboard id="opt-a-saved" label="A · Conferma dopo il salvataggio" width={1180} height={760}>
            <Dashboard variant="A" barState="saved" toast={true} />
          </DCArtboard>
        </DCSection>

        <DCSection id="states" title="Stati della barra" subtitle="Ricostruiti 1:1 da SaveLinkBar.tsx — il bottone è disabilitato finché l'URL non è valido">
          <DCArtboard id="s-default" label="Vuoto" width={560} height={230}>
            <StateCard name="Default" tag="IDLE" state="default"
              note="Bottone SAVE disabilitato (terracotta al 20%). Validazione: new URL(value) deve riuscire." />
          </DCArtboard>
          <DCArtboard id="s-focus" label="URL valido" width={560} height={230}>
            <StateCard name="Valid" tag="READY" state="focus"
              note="Bordo nero pieno al focus, bottone SAVE attivo (terracotta pieno). Invio = submit." />
          </DCArtboard>
          <DCArtboard id="s-saving" label="In salvataggio" width={560} height={230}>
            <StateCard name="Saving" tag="PENDING" state="saving"
              note="useActionState in pending: label «SAVING», bottone bloccato. resolvePageTitle() recupera il titolo." />
          </DCArtboard>
          <DCArtboard id="s-saved" label="Salvato" width={560} height={230}>
            <StateCard name="Saved" tag="DONE" state="saved"
              note="Campo svuotato (form.reset). Il link compare in Saved; toast opzionale di conferma." />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
