services:
  app:
    image: multivrss-app:latest
    restart: unless-stopped
    env_file: .env.production
    networks:
      - internal
    depends_on:
      - db
      - meilisearch

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ...
      POSTGRES_PASSWORD: ...
      POSTGRES_DB: multivrss-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ...
    volumes:
      - meilidata:/meili_data
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  meilidata:
